# Builds the project site and publishes it to GitHub Pages:
#   /          site/index.html — landing page + header that switches between projects
#   /india/    India EcoPolitical dashboard, exported to WebAssembly
#   /tickets/  topic-classification notebook, rendered to HTML (no code)
#   /sales/    e-commerce sales dashboard (Shiny for Python), exported to WebAssembly
#   /forecast/      demand-forecasting notebook, rendered to HTML (no code)
#   /forecast-app/  promo planner (Shiny for Python), exported to WebAssembly
#
# Why an Action rather than committing the build: the shinylive export is ~119MB
# of generated webR runtime and package binaries. That belongs in a Pages
# artifact, not in git history. The repo stays source-only.

name: Deploy dashboard

# Merging a PR into main (a push to main) that touches something the site is built from
# rebuilds and republishes. Open PRs get the build only, no deploy, so a broken export
# fails before merge. The manual button stays for rebuilding without a code change.
# See docs/DEPLOYMENT.md.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'indian-ecopolitical-growth/app.R'
      - 'indian-ecopolitical-growth/R/**'
      - 'indian-ecopolitical-growth/data_processed/**'
      - 'topic-classification/*.ipynb'
      - 'ecommerce-sales-dashboard/app.py'
      - 'ecommerce-sales-dashboard/data/**'
      - 'ecommerce-demand-forecasting/*.ipynb'
      - 'ecommerce-demand-forecasting/app.py'
      - 'ecommerce-demand-forecasting/data/**'
      - 'site/**'
      - '.github/workflows/deploy-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'indian-ecopolitical-growth/app.R'
      - 'indian-ecopolitical-growth/R/**'
      - 'indian-ecopolitical-growth/data_processed/**'
      - 'topic-classification/*.ipynb'
      - 'ecommerce-sales-dashboard/app.py'
      - 'ecommerce-sales-dashboard/data/**'
      - 'ecommerce-demand-forecasting/*.ipynb'
      - 'ecommerce-demand-forecasting/app.py'
      - 'ecommerce-demand-forecasting/data/**'
      - 'site/**'
      - '.github/workflows/deploy-dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true      # Ubuntu binaries — minutes not hours

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib
            any::plotly
            any::dplyr
            any::tidyr
            any::nanoparquet

      - name: Stage app (runtime files only)
        run: |
          mkdir -p stage/R stage/data_processed
          cp indian-ecopolitical-growth/app.R              stage/
          cp indian-ecopolitical-growth/R/theme.R          stage/R/
          cp indian-ecopolitical-growth/R/charts.R         stage/R/
          cp indian-ecopolitical-growth/data_processed/*.parquet stage/data_processed/
          echo "staged:" && find stage -type f

      - name: Export to WebAssembly
        run: shinylive::export("stage", "_site/india")
        shell: Rscript {0}

      # Rendered from the committed outputs, so no data download or re-run is needed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Render topic-classification notebook
        run: |
          pip install nbconvert
          jupyter nbconvert --to html --no-input \
            topic-classification/department_classifier_pipeline.ipynb \
            --output-dir _site/tickets --output index
          sed -i 's#</head>#<link rel="stylesheet" href="../notebook.css"></head>#' _site/tickets/index.html

      # Rendered from committed outputs like the tickets notebook; the notebook also writes data/forecasts.csv for the planner.
      - name: Render demand-forecasting notebook
        run: |
          jupyter nbconvert --to html --no-input \
            ecommerce-demand-forecasting/demand_forecasting.ipynb \
            --output-dir _site/forecast --output index
          sed -i 's#</head>#<link rel="stylesheet" href="../notebook.css"></head>#' _site/forecast/index.html

      # Only the app and its CSV are staged: the notebook, venv and data dictionary stay out of the bundle.
      - name: Export sales dashboard to WebAssembly
        run: |
          pip install shinylive==0.8.12
          mkdir -p stage-sales/data
          cp ecommerce-sales-dashboard/app.py stage-sales/
          cp ecommerce-sales-dashboard/data/ecommerce_demand_weekly.csv stage-sales/data/
          shinylive export stage-sales _site/sales

      - name: Export promo planner to WebAssembly
        run: |
          mkdir -p stage-forecast/data
          cp ecommerce-demand-forecasting/app.py stage-forecast/
          cp ecommerce-demand-forecasting/data/{forecasts,p90_factors,ecommerce_demand_weekly}.csv stage-forecast/data/
          shinylive export stage-forecast _site/forecast-app

      - name: Add site shell (landing page, header, notebook fonts, images)
        run: cp -r site/. _site/

      # One snippet for all six pages: the landing page plus the five generated ones, which don't exist in git.
      # The shinylive editor (edit/) is skipped. Fails the build if any page is left untagged.
      - name: Add Google Analytics to every page
        run: |
          find _site -name index.html -not -path '*/edit/*' | while read -r f; do
            perl -0pi -e 'BEGIN{local $/; open F,".github/ga-snippet.html"; $g=<F>} s#</body>#$g</body>#i' "$f"
          done
          missing=$(grep -rL G-WMVWTJ7M4X --include=index.html --exclude-dir=edit _site)
          [ -z "$missing" ] || { echo "untagged: $missing"; exit 1; }

      - name: Report bundle size
        run: du -sh _site && find _site -type f | wc -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
