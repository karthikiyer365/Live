<!-- GA4, shared across karthikiyer.info sites. Injected into every built index.html by deploy-dashboard.yml. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WMVWTJ7M4X"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-WMVWTJ7M4X');

  document.addEventListener('click', function (e) {
    var el = e.target.closest('a, button, [role=button], [data-track]');
    if (!el) return;
    // gtag appends _gl (client id) to cross-subdomain links on click; drop it so href groups.
    var href;
    if (el.tagName === 'A') { var u = new URL(el.href); u.searchParams.delete('_gl'); href = u.toString(); }
    gtag('event', 'click_through', {
      label: el.dataset.track || el.getAttribute('aria-label') || (el.textContent || '').trim().slice(0, 60) || '(unlabeled)',
      element: el.tagName.toLowerCase(),
      href: href,
      dest_host: href ? new URL(href).hostname : undefined,
      page_path: location.pathname,
      page_host: location.hostname
    });
  }, true);

  // The landing page opens projects in an iframe by changing the #hash, which GA never sees as a navigation.
  // Log it (clicks, back button, typed hash) so landing -> project shows up as one from/to event.
  if (window.top === window) {
    addEventListener('hashchange', function (e) {
      gtag('event', 'page_navigate', {
        from_hash: new URL(e.oldURL).hash || '(landing)',
        to_hash: location.hash || '(landing)',
        page_path: location.pathname,
        page_host: location.hostname
      });
    });
  }
</script>
