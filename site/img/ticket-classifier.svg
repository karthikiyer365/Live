<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" role="img" aria-labelledby="t d">
  <title id="t">Classification model — ML · NLP</title>
  <desc id="d">Support tickets pass through TF-IDF features and a Logistic Regression model into four ticket types: Incident, Request, Problem and Change. Low-confidence tickets go to a person.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9b9b9b"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dd0077"/>
    </marker>
    <style>
      .sans { font-family: Geist, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="760" height="530" fill="#fafafa"/>

  <!-- heading -->
  <text x="48" y="70" class="mono" font-size="19" letter-spacing="3" fill="#dd0077">ML · NLP</text>
  <text x="48" y="120" class="sans" font-size="44" font-weight="700" fill="#1a1a1a" letter-spacing="-0.5">Classification model</text>
  <text x="48" y="156" class="sans" font-size="19" fill="#5c5c5c">Reading a support ticket and routing it by type</text>

  <!-- tickets -->
  <g>
    <rect x="68" y="262" width="136" height="92" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="58" y="276" width="136" height="92" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="48" y="290" width="136" height="92" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
    <rect x="64" y="308" width="72" height="9" rx="4.5" fill="#1a1a1a"/>
    <rect x="64" y="328" width="104" height="7" rx="3.5" fill="#d6d6d6"/>
    <rect x="64" y="344" width="92" height="7" rx="3.5" fill="#d6d6d6"/>
    <rect x="64" y="360" width="68" height="7" rx="3.5" fill="#d6d6d6"/>
    <text x="116" y="412" class="mono" font-size="15" fill="#6b6b6b" text-anchor="middle">ticket text</text>
  </g>

  <line x1="196" y1="336" x2="244" y2="336" stroke="#9b9b9b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- model -->
  <g>
    <rect x="252" y="272" width="176" height="128" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="340" y="310" class="mono" font-size="15" fill="#6b6b6b" text-anchor="middle">TF-IDF</text>
    <line x1="284" y1="324" x2="396" y2="324" stroke="#ebebeb" stroke-width="2"/>
    <text x="340" y="354" class="sans" font-size="20" font-weight="600" fill="#1a1a1a" text-anchor="middle">Logistic</text>
    <text x="340" y="380" class="sans" font-size="20" font-weight="600" fill="#1a1a1a" text-anchor="middle">Regression</text>
  </g>

  <!-- fan-out to types -->
  <g fill="none" stroke="#9b9b9b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M428 316 C 470 316, 470 232, 506 232"/>
    <path d="M428 330 C 470 330, 470 300, 506 300"/>
    <path d="M428 344 C 470 344, 470 368, 506 368"/>
    <path d="M428 358 C 470 358, 470 436, 506 436"/>
  </g>

  <!-- type bins: recall on the test set -->
  <g class="sans">
    <rect x="514" y="208" width="198" height="48" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="514" y="208" width="7" height="48" rx="3" fill="#2a78d6"/>
    <text x="536" y="239" font-size="19" font-weight="600" fill="#1a1a1a">Incident</text>
    <text x="696" y="239" class="mono" font-size="15" fill="#6b6b6b" text-anchor="end">72.9%</text>

    <rect x="514" y="276" width="198" height="48" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="514" y="276" width="7" height="48" rx="3" fill="#eb6834"/>
    <text x="536" y="307" font-size="19" font-weight="600" fill="#1a1a1a">Request</text>
    <text x="696" y="307" class="mono" font-size="15" fill="#6b6b6b" text-anchor="end">98.5%</text>

    <rect x="514" y="344" width="198" height="48" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="514" y="344" width="7" height="48" rx="3" fill="#1baf7a"/>
    <text x="536" y="375" font-size="19" font-weight="600" fill="#1a1a1a">Problem</text>
    <text x="696" y="375" class="mono" font-size="15" fill="#6b6b6b" text-anchor="end">59.7%</text>

    <rect x="514" y="412" width="198" height="48" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <rect x="514" y="412" width="7" height="48" rx="3" fill="#eda100"/>
    <text x="536" y="443" font-size="19" font-weight="600" fill="#1a1a1a">Change</text>
    <text x="696" y="443" class="mono" font-size="15" fill="#6b6b6b" text-anchor="end">96.7%</text>
    <text x="712" y="488" class="mono" font-size="13" fill="#9b9b9b" text-anchor="end">recall on the test set</text>
  </g>

  <!-- hand-off -->
  <path d="M340 400 L340 480 L402 480" fill="none" stroke="#dd0077" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowPink)"/>
  <text x="412" y="486" class="sans" font-size="17" font-weight="600" fill="#dd0077">a person</text>
  <text x="328" y="446" class="mono" font-size="14" fill="#dd0077" text-anchor="end">confidence &lt; 0.75</text>
</svg>
